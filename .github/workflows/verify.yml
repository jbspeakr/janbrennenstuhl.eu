name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Builds and tests every push and PR. Holds no production credentials: publish.yml releases
# the verified artifact after this workflow succeeds on a main push.
# A new push to a PR cancels its older run; main runs are never cancelled, since each one feeds a release.
concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Hugo
        run: ./scripts/bootstrap.sh
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        # npm downloads and Playwright's Chromium, keyed on the exact pins in package-lock.json.
        id: browsers
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: browser-qa-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Draw each article's social-card plate as a build input (Chromium, not committed)
        env:
          BROWSERS_CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          npm ci --ignore-scripts
          # The apt run of --with-deps is most of this step; on a cache hit the browser is
          # already there and the runner image carries its shared libraries.
          if [ "$BROWSERS_CACHED" = true ]; then npx playwright install chromium; else npx playwright install --with-deps chromium; fi
          ./scripts/card-plates.sh
      - name: Build once and run every static gate
        run: ./scripts/verify.sh
      - name: Verify deployment ordering without credentials
        run: python3 scripts/deploy.py --dry-run
      - name: Generate edge rules without credentials
        run: python3 scripts/edge_rules.py > edge-rules.json
      - name: Package the verified release
        run: python3 scripts/release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-site
          path: releases/*.tar.gz
          # 90 days on main is the rollback window (docs/DELIVERY.md); a PR's copy only feeds its browser job.
          retention-days: ${{ github.event_name == 'push' && 90 || 5 }}
          if-no-files-found: error
      - name: Bundle the MCP edge script
        run: python3 scripts/mcp_script.py --out mcp-script/mcp.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # The single-file MCP server the publish job deploys, so it never rebuilds. PRs only check that it bundles.
        if: github.event_name == 'push'
        with:
          name: mcp-script
          path: mcp-script/mcp.ts
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # The rules the publish job would sync, for review on the PR.
        with:
          name: edge-rules
          path: edge-rules.json
          retention-days: 30
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-site
          path: releases
      - name: Extract verified artifact
        run: tar -xzf releases/*.tar.gz
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        # npm downloads and Playwright's Chromium, keyed on the exact pins in package-lock.json.
        id: browsers
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: browser-qa-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser QA dependencies
        env:
          BROWSERS_CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          npm ci --ignore-scripts
          # The apt run of --with-deps is most of this step; on a cache hit the browser is
          # already there and the runner image carries its shared libraries.
          if [ "$BROWSERS_CACHED" = true ]; then npx playwright install chromium; else npx playwright install --with-deps chromium; fi
      - name: Browser contracts (axe matrix, keyboard, no-JS, reflow, negotiation)
        run: npm run test:browser
      - name: Lighthouse lab gate
        run: CHROMIUM_EXECUTABLE="$(node -e "console.log(require('playwright').chromium.executablePath())")" npm run test:lighthouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Home, article and guide at 360/768/1440 px in both themes, for design review on the PR.
        if: always()
        with:
          name: screenshots
          path: test-results/*.png
          retention-days: 30
          if-no-files-found: warn
  preview:
    # Opt-in staging preview for same-repository pull requests. Separate zone and credentials;
    # the production secrets are never referenced here. The preview is built for its own host.
    if: github.event_name == 'pull_request' && vars.PREVIEW_HOST != '' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Hugo
        run: ./scripts/bootstrap.sh
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        # npm downloads and Playwright's Chromium, keyed on the exact pins in package-lock.json.
        id: browsers
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: browser-qa-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Draw each article's social-card plate as a build input
        env:
          BROWSERS_CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          npm ci --ignore-scripts
          # The apt run of --with-deps is most of this step; on a cache hit the browser is
          # already there and the runner image carries its shared libraries.
          if [ "$BROWSERS_CACHED" = true ]; then npx playwright install chromium; else npx playwright install --with-deps chromium; fi
          ./scripts/card-plates.sh
      - name: Build for the preview host
        run: |
          HUGO=hugo; [ -x .tools/hugo ] && HUGO=.tools/hugo
          HUGO_PARAMS_SOURCE_REVISION="$(git rev-parse HEAD)-preview" "$HUGO" --minify --baseURL "https://${{ vars.PREVIEW_HOST }}/"
      - name: Upload to the staging zone
        env:
          BUNNY_PREVIEW_ZONE: ${{ secrets.PREVIEW_STORAGE_NAME }}
          BUNNY_PREVIEW_PASSWORD: ${{ secrets.PREVIEW_STORAGE_PASSWORD }}
          BUNNY_PREVIEW_HOST: ${{ vars.BUNNY_STORAGE_HOST }}
        run: |
          python3 scripts/deploy.py --preview
          echo "Preview: https://${{ vars.PREVIEW_HOST }}/" >> "$GITHUB_STEP_SUMMARY"
