# Monthly external-link check. Editorial, not a release gate: it never touches deployment and
# needs no credentials. Run by hand from the Actions tab when preparing a review.
name: links
on:
  schedule:
    - cron: '17 6 3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check every external link in content/ and data/
        run: python3 scripts/links.py --report test-results/links.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: link-report
          path: test-results/links.md
          retention-days: 90
