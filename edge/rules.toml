# Edge rules for the www pull zone. scripts/edge_rules.py turns this file and the built
# /redirects.json into Bunny edge rules; the publish job syncs them (docs/DELIVERY.md).
# Rules it manages carry the description prefix; rules added by hand in the dashboard are left alone.

host = "www.janbrennenstuhl.eu"
managedPrefix = "[repo] "
# Bunny's default is 50 edge rules per pull zone, hand-made rules included. Support can raise it;
# update this number when they do. The sync refuses to run past it.
maxRules = 50

# Hosts that 301 to https://<host> with the same path, so only one edge domain is ever indexed:
# the root domain, the zone's Bunny hostname and the old jbspeakr.cc domain. One rule, matched on the full URL.
canonicalFrom = ["janbrennenstuhl.eu", "*.b-cdn.net", "jbspeakr.cc", "www.jbspeakr.cc"]

# Plausible through our own host on neutral paths (docs/DECISIONS.md), as on urbanartcore.com and
# rucksackrebellen.de, so blockers that list plausible.io or its paths miss it. `origin` is the full
# URL the path maps to; paths need a file extension. The script path is params.analytics.plausible
# in config/_default/params.toml, the event path the endpoint in assets/js/theme.js.
[[proxy]]
name = "Plausible script"
path = "/r/s.js"
origin = "https://plausible.io/js/pa-lwYmB-AXA--rNMvzyMeuT.js"
edge = 3600

[[proxy]]
name = "Plausible events"
path = "/r/e.json"
origin = "https://plausible.io/api/event"

[headers]
"Strict-Transport-Security" = "max-age=31536000; includeSubDomains; preload"
"X-Content-Type-Options" = "nosniff"
"Referrer-Policy" = "strict-origin-when-cross-origin"
"Permissions-Policy" = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
# Same effect as frame-ancestors 'none' in the CSP, for browsers that predate it.
"X-Frame-Options" = "DENY"

# Enforced since November 2026. There is no report collector (docs/DECISIONS.md), so the proof is
# the browser suite: tests/browser.cjs loads every page type with this policy enforced and fails on
# any violation. To fall back, set header to "Content-Security-Policy-Report-Only" and publish.
# The sha256 sources are the inline theme script (assets/js/theme.js) and the speculation rules in
# layouts/_partials/head.html; scripts/check.py fails when the build's inline scripts and these
# hashes differ. Chromium did not honour 'inline-speculation-rules' next to a hash in testing, so
# the rules carry their own hash; the keyword stays for browsers that do.
# No inline styles: style attributes and <style> elements are blocked, so templates use classes.
# 'wasm-unsafe-eval' lets the Pagefind search engine (a same-origin WebAssembly module) compile; it
# does not allow eval() or inline script (docs/DECISIONS.md, Search).
# Do not expand the allowlists silently.
[csp]
header = "Content-Security-Policy"

[csp.directives]
"default-src" = "'self'"
"script-src" = "'self' 'sha256-y+XKvSCYG/Fi4uKM1CG8bJ0IRf77feTYnxoyklLsbgc=' 'sha256-zEEvCzOWv7s2bVJI0y5AtdS7QCAhpL3KGYT+BIxg3Y8=' 'inline-speculation-rules' 'wasm-unsafe-eval'"
"style-src" = "'self'"
"img-src" = "'self' data:"
"font-src" = "'self'"
"connect-src" = "'self'"
"object-src" = "'none'"
"base-uri" = "'self'"
"frame-ancestors" = "'none'"
"form-action" = "'self'"

# Browser Cache-Control (browser: the full header; browserTtl: seconds) and edge TTL (seconds) by URL pattern. Bunny wildcards, matched against
# the full URL. At most 25 patterns per rule, or 5 when the rule has an exclude list.
[[cache]]
name = "Documents"
# Browsers revalidate on every use (Cache-Control max-age=0) while the edge keeps the copy for `edge`.
# browserTtl, not browser: a max-age=0 header stops Bunny from caching the page at the edge.
browserTtl = 0
edge = 300
# The Pagefind API, its worker and the engine keep their names across releases, so they revalidate
# like documents (pagefind-entry.json is covered by "*.json").
patterns = ["*/", "*.html", "*.md", "*.json", "*.xml", "*.txt", "*/.well-known/*", "*/pagefind/*.js", "*/pagefind/*.pagefind"]

[[cache]]
name = "Fingerprinted assets and fonts"
browser = "public, max-age=31536000, immutable"
edge = 31536000
# Pagefind's index chunks and page fragments (*.pf_index, *.pf_fragment, …) carry a content hash too.
patterns = ["*/css/*", "*/js/*", "*_hu_*", "*/fonts/*.woff2", "*/pagefind/*.pf_*"]

[[cache]]
name = "Original images"
browser = "public, max-age=86400"
edge = 86400
patterns = ["*.webp", "*.png", "*.avif", "*.jpg", "*.svg"]
exclude = ["*_hu_*"]

[[cache]]
name = "Icons, manifest and documents"
browser = "public, max-age=86400"
edge = 86400
patterns = ["*.ico", "*.webmanifest", "*.pdf", "*.gif"]

[[mime]]
type = "text/markdown; charset=utf-8"
patterns = ["*.md"]

[[mime]]
type = "text/plain; charset=utf-8"
patterns = ["*.txt"]

[[mime]]
type = "application/feed+json; charset=utf-8"
patterns = ["*/feed.json"]

[[mime]]
type = "application/linkset+json"
patterns = ["*/.well-known/api-catalog"]

[[mime]]
type = "application/trafficadvice+json"
patterns = ["*/.well-known/traffic-advice"]
