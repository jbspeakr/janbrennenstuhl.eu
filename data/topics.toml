# The six topics. Order is display order. A page's topics come from its
# front-matter `topics` if set, otherwise from its tags through `tags` below.
# Descriptions are written for people; they also feed llms.txt and topic feeds.
# `card` is the topic's tone as sRGB for the social-card label, because Hugo's image filters only take hex:
# oklch(76% 0.075 hue), with the hue from the t-<topic> class in assets/css/site.css (docs/DESIGN.md).

