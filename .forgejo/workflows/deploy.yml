name: Publish Blog
on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:

jobs:
  deploy:
    runs-on: codeberg-small
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - uses: https://code.forgejo.org/actions/setup-go@v6
        with:
          go-version: '1.27.x' # Change this to whatever you need

      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: https://github.com/peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Restore Hugo cache
        id: restore-cache
        uses: https://code.forgejo.org/actions/cache/restore@v5
        with:
          path: ./resources
          key: brennenstuhl-hugo-resources-cache-
          restore-keys: |
            brennenstuhl-hugo-resources-cache-

      - name: Build
        run: hugo --minify

      - name: Setup IndexNow
        # Generate files dynamically to prevent them from being leaked in public repositories.
        # This example will put the file in the root directory of the site. You may change the location by yourself.
        run: echo ${{ secrets.INDEXNOW_KEY }} > public/${{ secrets.INDEXNOW_KEY }}.txt

      - name: Save Hugo cache
        uses: https://code.forgejo.org/actions/cache/save@v5
        with:
          path: ./resources
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}${{ hashFiles('./resources/**/*') }}

      - name: Deploy to BunnyCDN
        uses: https://github.com/ayeressian/bunnycdn-storage-deploy@v2.4.5
        with:
          source: "public"
          destination: ""
          storageZoneName: "${{ secrets.STORAGE_NAME }}"
          storagePassword: "${{ secrets.STORAGE_PASSWORD }}"
          accessKey: "${{ secrets.ACCOUNT_API_KEY }}"
          pullZoneId: "${{ secrets.ZONE_ID }}"
          upload: "true"
          remove: "true"
          purgePullZone: "true"

      - name: indexnow-action
        uses: https://github.com/bojieyang/indexnow-action@v2
        with:
          sitemap-location: 'https://www.janbrennenstuhl.eu/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
