# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon = "/favicon.svg"

[footer]
since = 2015
customText = "Made and hosted in the EU 🇪🇺"

[dateFormat]
published = "02. Jan 2006"
lastUpdated = "02. Jan 2006"

[sidebar]
emoji = "🔐"
subtitle = "Exploring usable security & website authentication with a foible for data breaches, account security and pass{keys, codes, words}."

[sidebar.avatar]
enabled = true
local = false
src = "/favicon.svg"

[article]
headingAnchor = true
math = false
readingTime = true

[article.license]
enabled = true
default = "Licensed under CC BY 4.0"

## Widgets
[[widgets.homepage]]
type = "search"

