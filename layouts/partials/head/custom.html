<script defer data-domain="janbrennenstuhl.eu" src="https://plausible.io/js/script.js"></script>
<meta name="ir-site-verification-token" value="441558954">
<meta name="fediverse:creator" content="@jbspeakr@infosec.exchange">
<link rel="me" href="https://infosec.exchange/@jbspeakr">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" crossorigin="use-credentials" href="/site.webmanifest" />

{{ $baseURL := "/" | absURL -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "https://www.janbrennenstuhl.eu/about/#person",
      "name": "Jan Brennenstuhl",
      "url": "https://www.janbrennenstuhl.eu/about/",
      "jobTitle": "Principal Software Engineer",
      "description": "Jan Brennenstuhl is a product-minded principal software engineer with focus on usable security & web authentication.",
      "sameAs": [
        "https://bsky.app/profile/janbrennenstuhl.eu",
        "https://github.com/jbspeakr",
        "https://infosec.exchange/@jbspeakr",
        "https://www.linkedin.com/in/brennenstuhl/"
      ],
        "image": {
            "@type": "ImageObject",
            "@id": "https://www.janbrennenstuhl.eu/about/#person-image",
            "url": "https://www.janbrennenstuhl.eu/about/jan-brennenstuhl.webp",
            "width": "1260",
            "height": "1920",
            "caption": "Jan Brennenstuhl"
        }
    },
    {
      "@type": "WebSite",
      "@id": {{ print $baseURL "#website" }},
      "url": {{ print $baseURL }},
      "name": "{{ .Site.Title }}",
      "description": "{{ .Site.Params.sidebar.subtitle }}",
      "publisher": {
        "@id": "https://www.janbrennenstuhl.eu/about/#person"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.janbrennenstuhl.eu/search/?keyword={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    },
    {
      {{ if and (ne .Kind "taxonomy") (ne .Kind "term") -}}
        "@type": "WebPage",
      {{ else -}}
        "@type": "CollectionPage",
      {{ end -}}
      "@id": {{ .Permalink }},
      "url": {{ .Permalink }},
      "name": "{{ .Title }}",
      "description": "{{ .Description }}",
      "isPartOf": {
        "@id": {{ print $baseURL "#website" }}
      },
      "about": {
        "@id": "https://www.janbrennenstuhl.eu/about/#person"
      },
      "datePublished": "{{ .PublishDate.Format "2006-01-02T15:04:05CET" }}",
      "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05CET" }}",
      "inLanguage": "{{ .Site.Params.languageCode }}",
      "potentialAction": [{
        "@type": "ReadAction", 
        "target": [{{ .Permalink }}]
      }]
    },
    
    {{ if not .IsHome -}}
    {
      "@type": "BreadcrumbList",
      "@id": {{ print .Permalink "#breadcrumb" }},
      "name": "Breadcrumbs",
      "itemListElement": [{
        "@type": "ListItem",
        "position": 1,
        "name": "{{ .Site.Title }}",
        "item": "{{ .Site.BaseURL }}"
      }, 
      {{ if eq .Section "post" -}}
      {{ with .Site.Taxonomies.categories.Get (index (.Params.categories) 0) }}
      {
        "@type": "ListItem",
        "position": 2,
        "name": "{{ .Page.Title }}",
        "item": {{ .Page.Permalink }}
      }, 
      {{ end -}}
      {
        "@type": "ListItem",
        "position": 3,
        "name": "{{ .Title }}",
        "item": {{ .Permalink }}
      },
      {{- else -}}
      {
        "@type": "ListItem",
        "position": 2,
        "name": "{{ .Title }}",
        "item": {{ .Permalink }}
      }
      {{ end -}}
      ]
    },
    {{ end -}}

    {{ if or (eq .Section "post") -}}
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "BlogPosting",
          "@id": {{ print .Permalink "#article" }},
          "headline": "{{ .Title }}",
          "description": "{{ .Description }}",
          "isPartOf": {
            "@id": {{ .Permalink }}
          },
          "mainEntityOfPage": {
            "@id": {{ .Permalink }}
          },
          "datePublished": "{{ .PublishDate.Format "2006-01-02T15:04:05CET" }}",
          "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05CET" }}",
          "author": {
            "@id": "https://www.janbrennenstuhl.eu/about/#person"
          },
          "publisher": {
            "@id": "https://www.janbrennenstuhl.eu/about/#person"
          },
          "image": {
            "@type": "ImageObject",
            "@id": {{ print .Permalink "#article-image" }},
            "url": {{ .Params.image }},
            "contentUrl": {{ .Params.image }},
            "caption": "{{ .Title }}"
          },
        },
      ]
    },
    {{ end -}}

    {{ if or (eq .Section "knowledge-base") (eq .Section "page") -}}
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Article",
          "@id": {{ print .Permalink "#article" }},
          "headline": "{{ .Title }}",
          "description": "{{ .Description }}",
          "isPartOf": {
            "@id": {{ .Permalink }}
          },
          "mainEntityOfPage": {
            "@id": {{ .Permalink }}
          },
          "datePublished": "{{ .PublishDate.Format "2006-01-02T15:04:05CET" }}",
          "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05CET" }}",
          "author": {
            "@id": "https://www.janbrennenstuhl.eu/about/#person"
          },
          "publisher": {
            "@id": "https://www.janbrennenstuhl.eu/about/#person"
          },
          {{ if .Params.image -}}
          "image": {
            "@type": "ImageObject",
            "@id": {{ print .Permalink "#article-image" }},
            "url": {{ .Params.image }},
            "contentUrl": {{ .Params.image }},
            "caption": "{{ .Title }}"
          },
          {{ end -}}
        },
      ]
    },
    {{ end -}}
  ]
}
</script>
