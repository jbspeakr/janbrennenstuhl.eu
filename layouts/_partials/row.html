{{- $kind := partial "data/kind.html" . -}}
<li class="row">
  <a href="{{ .RelPermalink }}"><span class="row-title">{{ .Title }}</span></a>
  <span class="row-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>{{ if ne $kind "essay" }} <span class="kind">{{ partial "ui/kind-label.html" $kind }}</span>{{ end }}{{ with partial "data/series.html" . }} <span class="series">{{ .title }}</span>{{ end }}</span>
</li>
