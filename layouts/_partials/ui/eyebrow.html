{{- $kind := partial "data/kind.html" . -}}
<p class="eyebrow">
  <span>{{ partial "ui/kind-label.html" $kind }}</span>
  {{- range partial "data/topics.html" . }}{{ with partial "data/topic.html" . }} <span aria-hidden="true">/</span> <a class="chip" href="/topics/{{ .id }}/"><span class="dot t-{{ .id }}" aria-hidden="true"></span>{{ .title }}</a>{{ end }}{{ end }}
  {{- with partial "data/series.html" . }} <span aria-hidden="true">/</span> <a href="#series">Series: {{ .title }}</a>{{ end }}
</p>
