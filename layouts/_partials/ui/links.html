{{- with .Params.links }}
<aside class="links-box" aria-labelledby="links-title"><h2 id="links-title">Links</h2><ul>{{ range . }}<li class="link-card">{{ with .image }}<img src="{{ . | relURL }}" alt="" width="40" height="40" loading="lazy" decoding="async">{{ end }}<div><a href="{{ .website }}" rel="sponsored">{{ .title }}</a>{{ with .description }}<p>{{ . }}</p>{{ end }}</div></li>{{ end }}</ul><p class="small">Affiliate link; see the <a href="/affiliate-disclaimer/">independence note</a>.</p></aside>
{{- end }}
