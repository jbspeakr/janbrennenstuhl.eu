<details class="reader" hidden>
  <summary aria-label="Reading settings"><span aria-hidden="true">Aa</span></summary>
  <div class="reader-panel">
    <fieldset><legend>Theme</legend>
      <label><input type="radio" name="theme" value="system"> System</label>
      <label><input type="radio" name="theme" value="dark"> Dark</label>
      <label><input type="radio" name="theme" value="light"> Light</label>
    </fieldset>
    <fieldset><legend>Text size</legend>
      <label><input type="radio" name="size" value="s"> Smaller</label>
      <label><input type="radio" name="size" value="m"> Default</label>
      <label><input type="radio" name="size" value="l"> Larger</label>
    </fieldset>
    <fieldset><legend>Line spacing</legend>
      <label><input type="radio" name="leading" value="m"> Default</label>
      <label><input type="radio" name="leading" value="l"> Relaxed</label>
    </fieldset>
    <p class="small">Stored only in this browser.</p>
  </div>
</details>
