{{- /* Quiet actions under a finding: its anchor, copy as a quote with the link, and the 1200×630 image. Context: dict page, id, quote (plain text), card. */ -}}
<p class="finding-tools"><a class="finding-id" href="#f-{{ .id }}" title="#f-{{ .id }}">Link<span class="sr-only"> to this finding</span></a><button type="button" class="text-button" data-quote="{{ .quote }}" data-quote-url="{{ .page.Permalink }}#f-{{ .id }}" hidden>Copy quote</button><a class="finding-card" href="{{ .card.RelPermalink }}" download>Save as image<span class="sr-only"> (PNG, 1200 by 630 pixels)</span></a></p>
