{{- /* Context: the essays, newest first. The newest as a card with its drawing, the next five as rows. */ -}}
<div class="essay-lead">
  <ol class="cards">{{ range first 1 . }}{{ partial "ui/essay-card.html" . }}{{ end }}</ol>
  <ol class="entries">{{ range first 5 (after 1 .) }}{{ partial "ui/essay-row.html" . }}{{ end }}</ol>
</div>
