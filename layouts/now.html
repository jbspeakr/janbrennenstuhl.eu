{{ define "main" }}
<article class="wrap page">
  <header class="page-header"><p class="eyebrow">Updated <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod.Format "2 January 2006" }}</time></p><h1>{{ .Title }}</h1></header>
  <ul class="now-list">{{ range .Params.now }}<li><span class="label">{{ .label }}</span><a href="{{ .url }}">{{ .title }}</a><p>{{ .note }}</p></li>{{ end }}</ul>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
