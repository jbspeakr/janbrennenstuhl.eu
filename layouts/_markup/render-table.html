<div class="table-scroll" tabindex="0" role="region" aria-label="{{ with .Attributes.caption }}{{ . }}{{ else }}Table {{ add .Ordinal 1 }}{{ end }}"><table{{ with .Attributes.class }} class="{{ . }}"{{ end }}>
{{- with .Attributes.caption }}<caption>{{ . | markdownify }}</caption>{{ end }}
<thead>{{ range .THead }}<tr>{{ range . }}<th scope="col"{{ with .Alignment }} style="text-align: {{ . | safeCSS }}"{{ end }}>{{ .Text }}</th>{{ end }}</tr>{{ end }}</thead>
<tbody>{{ range .TBody }}<tr>{{ range . }}<td{{ with .Alignment }} style="text-align: {{ . | safeCSS }}"{{ end }}>{{ .Text }}</td>{{ end }}</tr>{{ end }}</tbody>
</table></div>
